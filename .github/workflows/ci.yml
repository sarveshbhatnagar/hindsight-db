name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No lockfile: npm can only lock native optional deps (better-sqlite3,
      # rolldown, lightningcss, ...) for the platform that generated it
      # (npm/cli#4828), which breaks `npm ci` on every other OS.
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
